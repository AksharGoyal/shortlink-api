[project]
name = "shortlink-api"
version = "0.1.0"
description = "A URL shortener API in Python with FastAPI. Learning project covering REST design, validation, and rate-limiting."
readme = "README.md"
authors = [
    { name = "Akshar Goyal" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
]


[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
